name: Capture case study screenshots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-case-study-screenshots.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture live projects
        run: |
          mkdir -p public/case-studies
          node <<'NODE'
          const { chromium } = require('playwright');

          const targets = [
            ['tuklas-overview', 'https://learn.jonasl.online/'],
            ['tuklas-draw-color', 'https://learn.jonasl.online/games/draw-color'],
            ['kavanagh-resort', 'https://kavanagh-resort.vercel.app/'],
            ['tindahan', 'https://www.trytindahan.store/'],
            ['portfolio-home', 'https://www.jonasl.online/'],
            ['portfolio-work', 'https://www.jonasl.online/projects'],
            ['pdf-forge', 'https://pdfforge.jonasl.online/'],
            ['jordflix', 'https://jordflix.jonasl.online/'],
            ['fern-private-villas', 'https://the-fern-private-resort.vercel.app/'],
          ];

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
            colorScheme: 'dark',
          });

          for (const [name, url] of targets) {
            const page = await context.newPage();
            try {
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForTimeout(4500);
              await page.screenshot({
                path: `public/case-studies/${name}.png`,
                fullPage: false,
                animations: 'disabled',
              });
              console.log(`Captured ${name}: ${url}`);
            } catch (error) {
              console.error(`Failed ${name}: ${url}`, error);
              process.exitCode = 1;
            } finally {
              await page.close();
            }
          }

          await browser.close();
          NODE

      - name: Commit screenshots
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/case-studies
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore: refresh case study screenshots"
            git push origin HEAD:main
          fi
