name: Code health

on:
  push:
    branches: [main, "chore/**", "redesign/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  dead-code-audit:
    name: Dead code reachability audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit source reachability
        run: node scripts/audit-dead-code.mjs
