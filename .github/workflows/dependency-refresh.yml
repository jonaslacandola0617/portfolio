name: Temporary dependency refresh

on:
  push:
    branches:
      - fix/current-metadata-brand
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: fix/current-metadata-brand
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh patched dependencies
        run: |
          npm pkg set overrides.nanoid=3.3.18
          npm pkg set overrides.sharp=0.35.4
          npm pkg set overrides.deepmerge-ts=8.0.0
          npm install --save-exact \
            next@15.5.25 \
            @tiptap/core@3.30.5 \
            @tiptap/extension-link@3.30.5 \
            @tiptap/extension-placeholder@3.30.5 \
            @tiptap/extension-table@3.30.5 \
            @tiptap/extension-table-cell@3.30.5 \
            @tiptap/extension-table-header@3.30.5 \
            @tiptap/extension-table-row@3.30.5 \
            @tiptap/extension-task-item@3.30.5 \
            @tiptap/extension-task-list@3.30.5 \
            @tiptap/react@3.30.5 \
            @tiptap/starter-kit@3.30.5 \
            @tiptap/suggestion@3.30.5
          npm install --save-dev --save-exact eslint-config-next@15.5.25

      - name: Verify security and types
        run: |
          npm audit --omit=dev --audit-level=high
          npx tsc --noEmit

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh security-patched dependencies"
          git push origin HEAD:fix/current-metadata-brand
