name: Patch Gemini response schema

on:
  push:
    branches:
      - fix/gemini-authenticity-schema

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-authenticity-schema
      - name: Remove unsupported schema fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/admin/ai-authenticity/route.ts')
          text = path.read_text()
          target = '          additionalProperties: false,\n'
          count = text.count(target)
          if count != 2:
              raise SystemExit(f'expected 2 unsupported additionalProperties fields, found {count}')
          path.write_text(text.replace(target, ''))
          PY
          rm .github/workflows/patch-gemini-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/admin/ai-authenticity/route.ts .github/workflows/patch-gemini-schema.yml
          git commit -m "fix(ai): use Gemini-compatible response schema"
          git push origin HEAD:fix/gemini-authenticity-schema
